<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>PhotoBackup · Scanning Library</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .scanning-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: radial-gradient(circle at 50% 30%, rgba(59, 130, 246, 0.08) 0%, transparent 70%), var(--bg-base);
        }

        .scanning-card {
            width: 100%;
            max-width: 520px;
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 40px 32px;
            box-shadow: var(--shadow-lg);
            text-align: center;
            backdrop-filter: blur(12px);
            position: relative;
            overflow: hidden;
        }

        .scanning-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, #3b82f6, #60a5fa, #3b82f6);
            background-size: 200% 100%;
            animation: gradientMove 2s linear infinite;
        }

        @keyframes gradientMove {
            0% { background-position: 0% 0; }
            100% { background-position: 200% 0; }
        }

        .scanner-visual {
            position: relative;
            width: 80px;
            height: 80px;
            margin: 0 auto 24px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .scanner-ring {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            border: 2px solid var(--accent);
            opacity: 0.3;
            animation: pulseRing 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }

        .scanner-ring-delay {
            animation-delay: 0.75s;
        }

        @keyframes pulseRing {
            0% { transform: scale(0.8); opacity: 0.8; }
            100% { transform: scale(1.6); opacity: 0; }
        }

        .scanner-icon-box {
            width: 64px;
            height: 64px;
            background: var(--accent-light);
            border: 1px solid rgba(59, 130, 246, 0.3);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent);
            box-shadow: 0 0 24px var(--accent-glow);
            z-index: 2;
        }

        .scanner-icon-box svg {
            animation: scanBob 2.5s ease-in-out infinite alternate;
        }

        @keyframes scanBob {
            0% { transform: translateY(-2px) scale(0.98); }
            100% { transform: translateY(2px) scale(1.02); }
        }

        .scanning-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--text-primary);
        }

        .scanning-message {
            font-size: 0.95rem;
            color: var(--text-secondary);
            margin-bottom: 28px;
            min-height: 1.4em;
            word-break: break-word;
        }

        .progress-section {
            margin-bottom: 24px;
        }

        .progress-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .progress-header-label {
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .progress-header-percent {
            color: var(--accent);
            font-variant-numeric: tabular-nums;
            font-size: 1rem;
        }

        .progress-track {
            height: 10px;
            background: var(--bg-surface-raised);
            border-radius: var(--radius-full);
            overflow: hidden;
            border: 1px solid var(--border-color);
            position: relative;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #2563eb, #3b82f6);
            border-radius: var(--radius-full);
            transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 0 12px var(--accent-glow);
            position: relative;
        }

        .progress-fill::after {
            content: '';
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.25), transparent);
            animation: shimmer 1.5s infinite;
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        .status-metrics {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 24px;
        }

        .metric-box {
            background: var(--bg-surface-raised);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 12px 16px;
            text-align: left;
        }

        .metric-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 4px;
        }

        .metric-value {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-primary);
            font-variant-numeric: tabular-nums;
        }

        .scanning-footer {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .live-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: var(--accent);
            box-shadow: 0 0 8px var(--accent);
            animation: pulseDot 1.5s infinite;
        }

        @keyframes pulseDot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.75); }
        }

        .redirect-notice {
            display: none;
            margin-top: 16px;
            color: var(--success);
            font-size: 0.9rem;
            font-weight: 600;
        }

        .error-notice {
            display: none;
            margin-top: 16px;
            padding: 12px;
            background: var(--error-bg);
            border: 1px solid var(--error);
            border-radius: var(--radius-md);
            color: var(--error);
            font-size: 0.85rem;
        }

        .continue-btn {
            display: none;
            margin-top: 16px;
            width: 100%;
        }
    </style>
</head>
<body>
    <div class="scanning-wrapper">
        <div class="scanning-card">
            <!-- Visual Icon -->
            <div class="scanner-visual">
                <div class="scanner-ring"></div>
                <div class="scanner-ring scanner-ring-delay"></div>
                <div class="scanner-icon-box">
                    <svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="18" height="18" rx="4" ry="4"></rect>
                        <circle cx="8.5" cy="8.5" r="1.5"></circle>
                        <polyline points="21 15 16 10 5 21"></polyline>
                    </svg>
                </div>
            </div>

            <!-- Title & Message -->
            <h1 class="scanning-title" id="scanTitle">Scanning Media Library</h1>
            <p class="scanning-message" id="scanMessage">Discovering media files and indexing metadata...</p>

            <!-- Progress Bar -->
            <div class="progress-section">
                <div class="progress-header">
                    <span class="progress-header-label" id="phaseLabel">Initializing</span>
                    <span class="progress-header-percent" id="percentLabel">0%</span>
                </div>
                <div class="progress-track">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
            </div>

            <!-- Metrics Grid -->
            <div class="status-metrics">
                <div class="metric-box">
                    <div class="metric-label">Items Processed</div>
                    <div class="metric-value" id="processedCount">0 / 0</div>
                </div>
                <div class="metric-box">
                    <div class="metric-label">Phase</div>
                    <div class="metric-value" id="phaseValue">Scanning</div>
                </div>
            </div>

            <!-- Footer / Status indicator -->
            <div class="scanning-footer" id="scanningFooter">
                <span class="live-dot"></span>
                <span>Server is live · Preparing gallery in background</span>
            </div>

            <div class="redirect-notice" id="redirectNotice">
                ✓ Scan complete! Redirecting to gallery...
            </div>

            <div class="error-notice" id="errorNotice"></div>
            <button id="continueBtn" class="button button-primary continue-btn">Continue to Gallery</button>
        </div>
    </div>

    <script>
        // Apply saved theme
        (function initTheme() {
            try {
                const savedTheme = localStorage.getItem('photobackup_theme');
                const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                document.documentElement.dataset.theme = savedTheme || (prefersDark ? 'dark' : 'light');
            } catch {}
        })();

        const scanTitle = document.getElementById('scanTitle');
        const scanMessage = document.getElementById('scanMessage');
        const phaseLabel = document.getElementById('phaseLabel');
        const percentLabel = document.getElementById('percentLabel');
        const progressFill = document.getElementById('progressFill');
        const processedCount = document.getElementById('processedCount');
        const phaseValue = document.getElementById('phaseValue');
        const scanningFooter = document.getElementById('scanningFooter');
        const redirectNotice = document.getElementById('redirectNotice');
        const errorNotice = document.getElementById('errorNotice');
        const continueBtn = document.getElementById('continueBtn');

        continueBtn.addEventListener('click', () => {
            window.location.replace('/');
        });

        let isRedirecting = false;
        let pollTimer = null;
        let failureCount = 0;

        function formatPhase(phase) {
            switch (phase) {
                case 'discovering': return 'Discovering';
                case 'processing': return 'Indexing';
                case 'finalizing': return 'Finalizing';
                case 'complete': return 'Complete';
                case 'idle': return 'Idle';
                case 'error': return 'Failed';
                default: return 'Scanning';
            }
        }

        async function checkScanStatus() {
            if (isRedirecting) return;

            try {
                const response = await fetch('/api/scan/status', { cache: 'no-store' });
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                failureCount = 0;
                const data = await response.json();

                const percent = Math.min(100, Math.max(0, data.percent || 0));
                const total = data.total || 0;
                const current = data.current || 0;
                const phase = data.phase || 'scanning';

                // Update UI elements
                progressFill.style.width = `${percent}%`;
                percentLabel.textContent = `${Math.round(percent)}%`;
                phaseLabel.textContent = formatPhase(phase);
                phaseValue.textContent = formatPhase(phase);
                processedCount.textContent = total > 0 ? `${current} / ${total}` : `${current}`;

                if (data.message) {
                    scanMessage.textContent = data.message;
                }

                // Check for fatal errors first
                if (data.error || phase === 'error') {
                    if (pollTimer) clearTimeout(pollTimer);
                    errorNotice.textContent = `Scan failed: ${data.error || 'Internal scanner error'}`;
                    errorNotice.style.display = 'block';
                    continueBtn.style.display = 'block';
                    scanningFooter.style.display = 'none';
                    return;
                }

                // Check if initial scan is complete
                if (!data.initial_scan_in_progress && data.initial_scan_completed) {
                    onScanComplete();
                    return;
                }

                // Schedule next poll sequentially
                pollTimer = setTimeout(checkScanStatus, 400);
            } catch (err) {
                failureCount++;
                const delay = Math.min(5000, 500 * Math.pow(1.5, failureCount));
                if (failureCount > 5) {
                    errorNotice.textContent = 'Unable to connect to server. Retrying...';
                    errorNotice.style.display = 'block';
                    continueBtn.style.display = 'block';
                }
                pollTimer = setTimeout(checkScanStatus, delay);
            }
        }

        function onScanComplete() {
            if (isRedirecting) return;
            isRedirecting = true;
            if (pollTimer) clearTimeout(pollTimer);

            progressFill.style.width = '100%';
            percentLabel.textContent = '100%';
            phaseLabel.textContent = 'Complete';
            phaseValue.textContent = 'Complete';
            scanTitle.textContent = 'Scan Complete';
            scanMessage.textContent = 'Your media library is ready!';
            scanningFooter.style.display = 'none';
            redirectNotice.style.display = 'block';

            setTimeout(() => {
                window.location.replace('/');
            }, 600);
        }

        // Start polling
        checkScanStatus();
    </script>
</body>
</html>
